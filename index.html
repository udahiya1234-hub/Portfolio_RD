<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahul Dahiya | Data Science Enthusiast</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #eff6ff; /* light mode fallback: blue-50 */
        color: #1f2937; /* light mode text: gray-800 */
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }
      body.dark {
        background-color: #0c0a09; /* dark mode fallback: stone-950 or close to blue-950/gray-900 base */
        color: #e4e4e7; /* dark mode text: zinc-200 */
      }

      html {
        scroll-behavior: smooth;
        @apply transition-colors duration-300;
      }

      /* Custom animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.6s ease-out forwards;
      }
      .animate-fade-in-down {
        animation: fadeInDown 0.6s ease-out forwards;
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      /* Ensure existing delay classes work with custom animations */
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }
      .delay-600 { animation-delay: 0.6s; }
      .delay-700 { animation-delay: 0.7s; }
      .delay-800 { animation-delay: 0.8s; }

      /* Custom scrollbar for chat widget */
      .custom-scrollbar {
        scrollbar-width: thin; /* For Firefox */
        scrollbar-color: #0ea5e9 #eff6ff; /* thumb color track color (light mode: sky-500, blue-50) */
      }
      .dark .custom-scrollbar {
        scrollbar-color: #059669 #0c0a09; /* thumb color track color (dark mode: emerald-600, stone-950) */
      }
      /* For Chrome, Safari, Opera */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #eff6ff; /* blue-50 */
        border-radius: 10px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: #0c0a09; /* stone-950 */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #0ea5e9; /* sky-500 */
        border-radius: 10px;
        border: 2px solid #eff6ff; /* blue-50 */
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #059669; /* emerald-600 */
        border: 2px solid #0c0a09; /* stone-950 */
      }

      /* Typing indicator animation */
      .dot-pulse {
        display: flex;
        align-items: flex-end; /* Align dots to bottom */
        height: 1.5rem; /* Ensure consistent height */
        padding-bottom: 0.25rem; /* Adjust to align with text baseline */
      }
      .dot-pulse-dot {
        width: 6px;
        height: 6px;
        margin: 0 2px;
        background-color: currentColor; /* Inherit color from parent */
        border-radius: 50%;
        animation: dotPulse 1.2s infinite ease-in-out;
      }
      .dot-pulse-dot:nth-child(1) { animation-delay: 0s; }
      .dot-pulse-dot:nth-child(2) { animation-delay: 0.2s; }
      .dot-pulse-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dotPulse {
        0%, 80%, 100% {
          transform: scale(0);
          opacity: 0;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
    <script>
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
